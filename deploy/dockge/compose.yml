services:
  flowerboi-web:
    image: ghcr.io/toribash67/flowerboi-web:latest
    container_name: flowerboi-web
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "18085:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
