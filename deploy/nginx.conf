server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        # The page is one small file; always revalidate so a new image shows up on the next load.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
